[project]
name = "yeshshree-backend"
version = "0.1.0"
description = "Yeshshree Operations App backend — FastAPI + PostgreSQL"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
    "sqlalchemy>=2.0",
    "alembic>=1.13",
    "pydantic>=2.6",
    "pydantic-settings>=2.2",
    "psycopg[binary]>=3.1",
    "python-multipart>=0.0.9",
    "structlog>=24.1",
    "pyjwt>=2.3",
    "zxing-cpp>=2.0",
    "pypdfium2>=4.0",
    "pillow>=10.0",
    "boto3>=1.34",
    "paramiko>=3.4",
    "openpyxl>=3.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "httpx>=0.27",
]

[tool.pytest.ini_options]
markers = [
    "postgres: needs a real PostgreSQL (excluded in verify-lite / Cowork sandbox)",
]
testpaths = ["tests"]
# cacheprovider/tmpdir misbehave on network-mounted repo paths (Cowork sandbox FUSE mount)
addopts = "-p no:cacheprovider --basetemp=/tmp/pytest-yeshshree"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]
